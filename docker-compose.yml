services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guia}
      POSTGRES_USER: ${POSTGRES_USER:-guia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guia}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_CONN: Host=db;Port=5432;Database=${POSTGRES_DB:-guia};Username=${POSTGRES_USER:-guia};Password=${POSTGRES_PASSWORD:-guia}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao-com-32-chars-min}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      GOOGLE_PLACES_KEY: ${GOOGLE_PLACES_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "${API_PORT:-8080}:8080"

  # web (opcional p/ demo local):
  # web:
  #   build: ./frontend
  #   ports:
  #     - "5173:80"
  #   depends_on:
  #     - api

volumes:
  pgdata:
